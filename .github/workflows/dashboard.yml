name: Dashboard
# Rebuilds docs/index.html whenever the data, settings, sources or the dashboard code change on main (GitHub Pages serves docs/).
on:
  push:
    branches: [main]
    paths: [data/**, xplorekit/config/**, xplorekit/build_dashboard.py, xplorekit/dashboard_template.html, xplorekit/build_libraries.py, xplorekit/library_template.html]
  workflow_dispatch:
concurrency: {group: dashboard, cancel-in-progress: false}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m xplorekit.build_dashboard
      - name: Commit the rebuilt page
        run: |
          git config user.name "xplorekit-research-bot"
          git config user.email "xplorekit-research-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || { git commit -m "Rebuild dashboard" && bash scripts/push_retry.sh; }
