<style>

e repository README for any further install steps"], "repo_url": "https://github.com/sickn33/agentic-awesome-skills", "example_use_case": "You want a ready-made skill for a task in your project, so you search the catalog, read the full skill file, and keep a reviewable list of the skills you chose.", "skill_type": "collection", "section": "skills", "first_seen": "2026-11-21", "last_checked": "2026-11-21", "status": "active", "quality_score": 86, "verified": ["schema", "not_duplicate", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "agentic-awesome-skills-909786"}, {"source_url": "https://github.com/affaan-m/ECC", "source_urls": ["https://github.com/affaan-m/ECC"], "name": "ECC", "summary": "An MIT-licensed toolkit that adds a structured engineering workflow to coding agents: planning, testing, implementation, review, verification and memory, with reusable skills for repeated tasks. It works best with Claude Code and has adapters for other agent tools.", "install_steps": ["Install only from the official channels listed in the README: the GitHub repository, the npm package ecc-universal, or the ecc@ecc plugin", "Follow the guided setup in the README, or use the native Claude Code plugin commands described there", "Choose one install method and do not stack a full manual Claude install on top of the plugin", "Check the README's platform support matrix before relying on features in tools other than Claude Code"], "repo_url": "https://github.com/affaan-m/ECC", "example_use_case": "You want Claude Code to plan a change, write tests first, review its own work from a fresh context and carry useful notes into later sessions, without rewriting that process in every prompt.", "skill_type": "collection", "section": "skills", "first_seen": "2026-11-17", "last_checked": "2026-11-17", "status": "active", "quality_score": 88, "verified": ["schema", "not_duplicate", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "ecc-3429c7"}, {"source_url": "https://github.com/Graphify-Labs/graphify", "source_urls": ["https://github.com/Graphify-Labs/graphify"], "name": "Graphify", "summary": "A /graphify skill that turns a codebase and its docs, SQL schemas, configs and PDFs into a queryable knowledge graph. Code is parsed locally with deterministic AST parsing. Each connection is labelled as explicitly extracted or inferred, and it uses a graph rather than a vector store.", "install_steps": ["See the repository README for install steps", "Type /graphify in your AI coding assistant to map the project into a graph"], "repo_url": "https://github.com/Graphify-Labs/graphify", "example_use_case": "You join an unfamiliar project and want to see how its modules, schemas and docs relate. You ask the graph to trace the path between two concepts instead of searching through files by hand.", "skill_type": "agent-skill", "section": "skills", "first_seen": "2026-11-16", "last_checked": "2026-11-18", "status": "active", "quality_score": 88, "verified": ["schema", "not_duplicate", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "graphify-dd6a9d"}, {"source_url": "https://github.com/ayghri/i-have-adhd", "source_urls": ["https://github.com/ayghri/i-have-adhd"], "name": "i-have-adhd", "summary": "A skill for coding assistants that changes how replies are written. Answers lead with the next action, multi-step tasks are numbered, lists are capped at five items, and preambles, recaps and closing pleasantries are dropped. It is based on ten rules set out in its SKILL.md file.", "install_steps": ["Paste into your coding assistant's prompt a request to install the i-have-adhd skill from the repository, pointing it at the repo's AGENTS.md for instructions", "Or follow the manual steps in the repository's INSTALL.md", "Restart your coding assistant, then invoke the skill as /i-have-adhd"], "repo_url": "https://github.com/ayghri/i-have-adhd", "example_use_case": "You ask your coding agent how to fix a failing auth check and want a short answer that names the file and line, lists numbered steps and ends with one next step, instead of a long explanation.", "skill_type": "claude-skill", "section": "skills", "first_seen": "2026-11-19", "last_checked": "2026-11-19", "status": "active", "quality_score": 88, "verified": ["schema", "not_duplicate", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "i-have-adhd-16169d"}, {"source_url": "https://github.com/GoogleChrome/modern-web-guidance", "source_urls": ["https://github.com/GoogleChrome/modern-web-guidance", "https://news.ycombinator.com/item?id=50443812"], "name": "Modern Web Guidance", "summary": "A set of skills that gives coding agents current web platform knowledge and browser compatibility data. It nudges agents away from older JavaScript-heavy patterns and toward native browser features. It is stewarded by the Chrome, Edge, Firefox and MDN teams together with the web community.", "install_steps": ["Run npx modern-web-guidance@latest install", "Follow the interactive wizard to choose how to install it", "Optionally try it first with npx modern-web-guidance@latest search followed by a topic", "See the repository README for alternative installation methods"], "repo_url": "https://github.com/GoogleChrome/modern-web-guidance", "example_use_case": "Your coding agent keeps building a modal from a div plus custom JavaScript. With this skill installed, it can look up guidance on the native dialog approach and use that instead.", "skill_type": "agent-skill", "section": "skills", "first_seen": "2026-11-16", "last_checked": "2026-11-17", "status": "active", "quality_score": 90, "verified": ["schema", "not_duplicate", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "modern-web-guidance-5175b6"}, {"source_url": "https://github.com/Egonex-AI/Understand-Anything", "source_urls": ["https://github.com/Egonex-AI/Understand-Anything"], "name": "Understand Anything", "summary": "A Claude Code plugin that analyzes a project with several cooperating agents and builds a knowledge graph of its files, functions, classes and dependencies. It then opens an interactive dashboard for browsing the graph, searching it, and viewing guided tours. A separate command can also map a markdown knowledge base.", "install_steps": ["See the repository README for install steps"], "repo_url": "https://github.com/Egonex-AI/Understand-Anything", "example_use_case": "You join a team with a large, unfamiliar codebase and want a visual map of how the parts connect, plus plain-English summaries, before reading any code.", "skill_type": "agent-skill", "section": "skills", "first_seen": "2026-11-19", "last_checked": "2026-11-19", "status": "active", "quality_score": 88, "verified": ["schema", "not_duplicate", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "understand-anything-1bf417"}],PAGES=[{"id": "dashboard", "name": "Dashboard", "href": "../"}, {"id": "prompts", "name": "Prompt Library", "href": "../prompts/"}, {"id": "skills", "name": "Claude Skills Library", "href": "../skills/"}, {"id": "extensions", "name": "Chrome Extension Library", "href": "../extensions/"}];
const $=s=>document.getElementById(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function link(h,t){const a=el("a",null,t);if(/^https?:\/\//.test(h)){a.href=h;a.target="_blank";a.rel="noopener noreferrer"}return a}
PAGES.forEach(p=>{const a=el("a",p.id===SECTION?"on":"",p.name);a.href=p.href;$("nav").appendChild(a)});
const facet=e=>SECTION==="prompts"?e.use_case:SECTION==="skills"?e.skill_type:e.pricing;
const title=e=>e.title||e.name;
const text=e=>[title(e),e.summary,e.prompt,e.example_use_case,(e.tags||[]).join(" "),facet(e),e.audience].join(" ").toLowerCase();
let cur="";
const facets=[...new Set(DATA.map(facet).filter(x=>x&&x!=="unknown"))].sort();
function chips(){const c=$("chips");c.textContent="";["All",...facets].forEach(f=>{const b=el("button",(f==="All"?"":f)===cur?"on":"",f);b.onclick=()=>{cur=f==="All"?"":f;chips();draw()};c.appendChild(b)})}
function card(e){const c=el("div","card");c.appendChild(el("h2",null,title(e)));
 if(SECTION==="prompts"){c.appendChild(el("p",null,e.example_output_summary||""));c.appendChild(el("pre",null,e.prompt));
  const b=el("button","copy","Copy prompt");b.onclick=()=>navigator.clipboard.writeText(e.prompt).then(()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy prompt",1500)});c.appendChild(b);
  const t=el("div");[e.use_case,...(e.models||[]),...(e.tags||[])].filter(Boolean).forEach(x=>t.appendChild(el("span","tag",x)));c.appendChild(t)}
 else if(SECTION==="skills"){c.appendChild(el("p",null,e.summary));if(e.example_use_case)c.appendChild(el("p",null,"Use it for: "+e.example_use_case));
  if((e.install_steps||[]).length){const ol=el("ol");e.install_steps.forEach(s=>ol.appendChild(el("li",null,s)));c.appendChild(ol)}
  c.appendChild(el("span","tag",e.skill_type||"skill"));if(e.repo_url)c.appendChild(link(e.repo_url,"Repository"))}
 else{c.appendChild(el("p",null,e.summary));if(e.audience)c.appendChild(el("p",null,"For: "+e.audience));
  (e.pros||[]).forEach(s=>c.appendChild(el("p",null,"+ "+s)));(e.cons||[]).forEach(s=>c.appendChild(el("p",null,"- "+s)));
  const t=el("div");[e.pricing==="unknown"?"":e.pricing,e.ai_related?"AI":""].filter(Boolean).forEach(x=>t.appendChild(el("span","tag",x)));c.appendChild(t);
  if(e.store_url)c.appendChild(link(e.store_url,"Chrome Web Store"));
  if(e.extension_last_updated)c.appendChild(el("div","meta","Store page last updated: "+e.extension_last_updated))}
 const m=el("div","meta");m.appendChild(document.createTextNode("Source: "));m.appendChild(link(e.source_url,"original"));m.appendChild(document.createTextNode(" · checked "+e.last_checked));c.appendChild(m);return c}
function draw(){const q=$("q").value.toLowerCase().trim(),g=$("grid");g.textContent="";
 const r=DATA.filter(e=>(!cur||facet(e)===cur)&&(!q||text(e).includes(q)));r.forEach(e=>g.appendChild(card(e)));$("empty").hidden=r.length>0}
$("q").oninput=draw;chips();draw();
</script></body></html>
