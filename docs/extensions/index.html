"https://github.com/surfmind-space/awesome-surfmind", "https://chromewebstore.google.com/detail/pghallcbnfabbgfijhbcldaapmgidnaa"], "name": "SurfMind", "summary": "An AI assistant that opens as a browser sidebar, reads the page you are on and answers using the AI model you pick. It can connect MCP servers and skills, and can take actions on the page as well as answer questions.", "audience": "People who want an AI sidebar in their browser and prefer to choose their own model provider, including local models.", "pros": ["Works with your own API key from providers such as OpenAI, Anthropic or Google, or through OpenRouter", "Can run local models through tools such as Ollama, LM Studio, llama.cpp or vLLM", "Supports MCP servers and skills for extending what it can do", "Can act on the page, not only answer questions", "Available for Chrome, Edge, Firefox and Safari"], "cons": ["Relies on a third-party AI service or a local model that you set up yourself", "Using your own API key means model usage costs depend on your provider", "Reads the content of the page you are viewing, so page text goes to the model you choose"], "pricing": "unknown", "pricing_note": "", "ai_related": true, "store_url": "https://chromewebstore.google.com/detail/pghallcbnfabbgfijhbcldaapmgidnaa", "extension_last_updated": "unknown", "alternatives": [], "section": "extensions", "first_seen": "2026-11-18", "last_checked": "2026-11-23", "status": "active", "quality_score": 88, "verified": ["schema", "not_duplicate", "store_link_live", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "surfmind-cf61ec"}, {"source_url": "https://github.com/smblott-github/text-aid-too", "source_urls": ["https://github.com/smblott-github/text-aid-too", "https://chromewebstore.google.com/detail/text-aid-too/klbcooigafjpbiahdjccmajnaehomajc"], "name": "Text-Aid-Too", "summary": "Lets you edit text on web pages in your own desktop text editor, such as Vim or Emacs. It works with ordinary text inputs and with contentEditable fields like the Gmail compose window. The page updates each time you save the file.", "audience": "People who prefer writing in a native editor such as Vim or Emacs and want to use it for text boxes on the web.", "pros": ["Works with contentEditable inputs such as the Gmail compose window, as well as ordinary HTML inputs", "Updates the page whenever the file is saved, so changes can be previewed as you write", "Temporary files get a .txt or .html extension, so the editor can detect the file type", "Keyboard shortcut can be changed on the extension's options page", "Optional Markdown markup in contentEditable inputs for writing rich-text Gmail messages"], "cons": ["Needs a separate local server, installed with npm and requiring Node.js, running alongside the extension", "The editor command must stay in the foreground and not fork, so some editors need a special flag such as gvim -f", "Markdown support in contentEditable inputs is described as experimental", "Setup may involve configuring a port and shared secret on the options page"], "pricing": "unknown", "pricing_note": "", "ai_related": false, "store_url": "https://chromewebstore.google.com/detail/text-aid-too/klbcooigafjpbiahdjccmajnaehomajc", "extension_last_updated": "unknown", "alternatives": [], "section": "extensions", "first_seen": "2026-11-18", "last_checked": "2026-11-23", "status": "active", "quality_score": 91, "verified": ["schema", "not_duplicate", "store_link_live", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "text-aid-too-12f67d"}, {"source_url": "https://github.com/anc95/writely", "source_urls": ["https://github.com/anc95/writely", "https://chromewebstore.google.com/detail/writely/eocenplmfgoaibmmohkhhocnlkpaecgn"], "name": "Writely", "summary": "A browser extension that brings AI writing help to editors on any web page. It uses OpenAI's GPT models to draft text such as emails and articles, and it can also help with translation and reading. It is positioned as an alternative to Notion AI.", "audience": "People who write emails, posts or replies in the browser and want AI drafting help outside of a dedicated writing app.", "pros": ["Works on editors across many web pages, not one site", "Covers writing, translation and reading assistance", "Also offered for Firefox and Edge"], "cons": ["Needs your own OpenAI API key, which you set up in the settings", "Labelled as a beta", "Relies on a third-party AI service"], "pricing": "unknown", "pricing_note": "", "ai_related": true, "store_url": "https://chromewebstore.google.com/detail/writely/eocenplmfgoaibmmohkhhocnlkpaecgn", "extension_last_updated": "unknown", "alternatives": ["Notion AI"], "section": "extensions", "first_seen": "2026-11-16", "last_checked": "2026-11-23", "status": "active", "quality_score": 88, "verified": ["schema", "not_duplicate", "store_link_live", "link_live", "no_verbatim_copy", "fact_check:llm"], "id": "writely-0d1d31"}],PAGES=[{"id": "dashboard", "name": "Dashboard", "href": "../"}, {"id": "prompts", "name": "Prompt Library", "href": "../prompts/"}, {"id": "skills", "name": "Claude Skills Library", "href": "../skills/"}, {"id": "extensions", "name": "Chrome Extension Library", "href": "../extensions/"}];
const $=s=>document.getElementById(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function link(h,t){const a=el("a",null,t);if(/^https?:\/\//.test(h)){a.href=h;a.target="_blank";a.rel="noopener noreferrer"}return a}
PAGES.forEach(p=>{const a=el("a",p.id===SECTION?"on":"",p.name);a.href=p.href;$("nav").appendChild(a)});
const facet=e=>SECTION==="prompts"?e.use_case:SECTION==="skills"?e.skill_type:e.pricing;
const title=e=>e.title||e.name;
const text=e=>[title(e),e.summary,e.prompt,e.example_use_case,(e.tags||[]).join(" "),facet(e),e.audience].join(" ").toLowerCase();
let cur="";
const facets=[...new Set(DATA.map(facet).filter(x=>x&&x!=="unknown"))].sort();
function chips(){const c=$("chips");c.textContent="";["All",...facets].forEach(f=>{const b=el("button",(f==="All"?"":f)===cur?"on":"",f);b.onclick=()=>{cur=f==="All"?"":f;chips();draw()};c.appendChild(b)})}
function card(e){const c=el("div","card");c.appendChild(el("h2",null,title(e)));
 if(SECTION==="prompts"){c.appendChild(el("p",null,e.example_output_summary||""));c.appendChild(el("pre",null,e.prompt));
  const b=el("button","copy","Copy prompt");b.onclick=()=>navigator.clipboard.writeText(e.prompt).then(()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy prompt",1500)});c.appendChild(b);
  const t=el("div");[e.use_case,...(e.models||[]),...(e.tags||[])].filter(Boolean).forEach(x=>t.appendChild(el("span","tag",x)));c.appendChild(t)}
 else if(SECTION==="skills"){c.appendChild(el("p",null,e.summary));if(e.example_use_case)c.appendChild(el("p",null,"Use it for: "+e.example_use_case));
  if((e.install_steps||[]).length){const ol=el("ol");e.install_steps.forEach(s=>ol.appendChild(el("li",null,s)));c.appendChild(ol)}
  c.appendChild(el("span","tag",e.skill_type||"skill"));if(e.repo_url)c.appendChild(link(e.repo_url,"Repository"))}
 else{c.appendChild(el("p",null,e.summary));if(e.audience)c.appendChild(el("p",null,"For: "+e.audience));
  (e.pros||[]).forEach(s=>c.appendChild(el("p",null,"+ "+s)));(e.cons||[]).forEach(s=>c.appendChild(el("p",null,"- "+s)));
  const t=el("div");[e.pricing==="unknown"?"":e.pricing,e.ai_related?"AI":""].filter(Boolean).forEach(x=>t.appendChild(el("span","tag",x)));c.appendChild(t);
  if(e.store_url)c.appendChild(link(e.store_url,"Chrome Web Store"));
  if(e.extension_last_updated)c.appendChild(el("div","meta","Store page last updated: "+e.extension_last_updated))}
 const m=el("div","meta");m.appendChild(document.createTextNode("Source: "));m.appendChild(link(e.source_url,"original"));m.appendChild(document.createTextNode(" · checked "+e.last_checked));c.appendChild(m);return c}

 const r=DATA.filter(e=>(!cur||facet(e)===cur)&&(!q||text(e).includes(q)));r.forEach(e=>g.appendChild(card(e)));$("empty").hidden=r.length>0}
$("q").oninput=draw;chips();draw();
